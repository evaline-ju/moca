# Single-replica, presence-only gRPC relay (spec §6). Bridges the worker's
# outbound SandboxWorker.Attach stream to in-cluster SandboxExec calls and
# mirrors connected workers into the Redis pool. Inert until SH_REMOTE_SANDBOX
# is enabled on the harness AND a worker connects. Reuses the harness image with
# the relay entrypoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-relay
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-relay
  template:
    metadata:
      labels:
        app: sandbox-relay
    spec:
      containers:
        - name: sandbox-relay
          image: dev.local/moca:local
          imagePullPolicy: IfNotPresent
          # Run from the relay's own package dir. `node --import tsx` resolves the tsx
          # loader relative to the CWD, and the published image links tsx (a devDep) into
          # packages/sandbox-relay/node_modules — NOT a root-hoisted /app/node_modules — so
          # a CWD of /app crashes with ERR_MODULE_NOT_FOUND 'tsx' (issue #102 follow-up).
          # From the package dir, tsx and all runtime deps (@grpc/grpc-js, @moca/*) resolve
          # locally. Matches the package.json `start` script (`node --import tsx src/main.ts`).
          workingDir: /app/packages/sandbox-relay
          command: ['node', '--import', 'tsx', 'src/main.ts']
          env:
            - name: REDIS_URL
              value: redis://redis.default.svc.cluster.local:6379
            - name: SH_RELAY_PORT
              value: '8443'
            # Relay auth is fail-closed (see main.ts's makeDefaultValidateToken): with
            # no token set, every worker Attach is rejected before the stream is parked.
            # MUST equal the worker's SANDBOX_TOKEN (see worker-example.yaml). This
            # hardcoded dev value is fine for Kind/local dev, but this file is also
            # included, unpatched, by the OCP overlay (overlays/ocp/kustomization.yaml),
            # so it is a valid credential on any OCP-deployed relay too. secretKeyRef
            # (issue #173) is a prerequisite for any non-dev OCP worker use.
            - name: SH_RELAY_TOKEN
              value: dev-token
            # The workers' credential for SandboxExec (MI1 §5 R5). A documented public DEV value,
            # like SH_RELAY_TOKEN above; the OCP overlay replaces it from a Secret.
            #
            # So on plain Kubernetes (Kind, setup-k8s.sh, relay-leaf-smoke.sh) R5 gives NO
            # sandbox-to-sandbox isolation: this value is in the repo, and with no
            # MOCA_RELAY_EXEC_ADDR set the relay serves SandboxExec on the same :8443 every
            # sandbox attaches to, so any sandbox pod can Exec into any other. Multi-user on this
            # path is out of scope (MI1 spec §13); use the OCP overlay's Secret, or deploy/vm or
            # compose, where the exec listener is split off.
            - name: MOCA_RELAY_EXEC_TOKEN
              value: dev-exec-token
          ports:
            - containerPort: 8443
          # The entrypoint is `node --import tsx src/main.ts`, so tsx compiles the relay's
          # TypeScript in memory at startup: measured 224 MiB steady / 225 MiB peak while
          # merely idle, before a single exec is relayed. The previous 128Mi limit was
          # therefore never survivable -- the container was OOMKilled (exit 137) during
          # startup, restarting before it ever bound :8443. That failed silently in the
          # worst possible way: `rollout status` reports Ready (the Deployment declares no
          # readinessProbe, so Running is enough), and only a connection attempt revealed
          # "connection refused inside namespace". Requests cover the measured idle
          # footprint; the limit leaves headroom for concurrent relayed streams.
          resources:
            requests:
              memory: '256Mi'
              cpu: '50m'
            limits:
              memory: '512Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-relay
  namespace: default
spec:
  selector:
    app: sandbox-relay
  ports:
    - port: 8443
      targetPort: 8443
